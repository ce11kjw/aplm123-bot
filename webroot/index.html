<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>aplm123 · 万能下载器</title>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{
  --bg:#070b14;--bg2:#0d1220;--card:#121a2c;--card2:#182238;--line:#232f48;
  --txt:#eaf1fb;--sub:#8595b3;--dim:#5c6a86;
  --ac:#4f8cff;--ac2:#22d3ee;--vio:#8b5cf6;
  --ok:#22c55e;--warn:#f59e0b;--err:#ef4444;
  --glow:0 0 36px rgba(79,140,255,.28);
  --nav-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;background:
  radial-gradient(500px circle at 12% 8%,rgba(79,140,255,.12),transparent 42%),
  radial-gradient(600px circle at 88% 22%,rgba(34,211,238,.09),transparent 42%),
  radial-gradient(460px circle at 50% 92%,rgba(139,92,246,.09),transparent 42%);
  z-index:-1;pointer-events:none}
a{color:var(--ac2);text-decoration:none}
svg{stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* 顶部栏 */
.top{position:sticky;top:0;z-index:40;background:rgba(7,11,20,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;height:56px;max-width:640px;margin:0 auto;padding:0 16px;gap:10px}
.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:7px;margin-right:auto}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ac2);box-shadow:0 0 10px var(--ac2);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.brand b{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ptag{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;color:var(--ac2)}
.ptag svg{width:15px;height:15px}

/* 底部导航 */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(10,14,26,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex}
.botnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);cursor:pointer;font-size:11px;font-weight:600;transition:.15s;position:relative}
.botnav a svg{width:23px;height:23px;transition:.15s}
.botnav a.on{color:var(--ac2)}
.botnav a.on svg{stroke:var(--ac2);filter:drop-shadow(0 0 6px rgba(34,211,238,.5))}
.botnav a.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--ac2)}

/* 通用 */
.view{padding-top:18px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px;font-weight:700}
.card h3 svg{width:18px;height:18px;color:var(--ac2)}
.sec-t{font-size:23px;font-weight:800;margin-bottom:4px;letter-spacing:-.5px;padding:0 2px}
.sec-d{color:var(--sub);margin-bottom:18px;font-size:14px;padding:0 2px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:15px;border-radius:13px;font-weight:700;cursor:pointer;border:none;font-size:16px;transition:.15s;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 4px 18px rgba(79,140,255,.32)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;box-shadow:none}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.sm{width:auto;padding:10px 16px;font-size:14px;border-radius:11px;box-shadow:none}
.btn svg{width:19px;height:19px}
input,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:13px;padding:15px;color:var(--txt);font-size:16px;font-family:inherit;transition:.15s}
input:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(79,140,255,.14)}
label{display:block;font-size:13.5px;color:var(--sub);margin:14px 0 7px;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:center}
.stat .n{font-size:24px;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.15}
.stat .l{color:var(--sub);font-size:12px;margin-top:4px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{padding:11px 16px;border-radius:11px;background:var(--card2);border:1px solid var(--line);cursor:pointer;font-size:14px;color:var(--sub);transition:.15s;font-weight:600}
.pill:active{transform:scale(.96)}
.pill.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dlprev img,.dlprev video{width:100%;border-radius:14px;margin-top:12px;border:1px solid var(--line)}
.hero{text-align:center;padding:36px 0 26px}
.hero .badge{display:inline-block;padding:6px 15px;border-radius:20px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;color:var(--ac2);margin-bottom:18px}
.hero h1{font-size:clamp(29px,8vw,42px);font-weight:800;line-height:1.15;margin-bottom:14px;letter-spacing:-1px}
.hero h1 .g{background:linear-gradient(90deg,var(--ac),var(--ac2) 60%,var(--vio));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--sub);font-size:15.5px;margin-bottom:24px}
.feat{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px}
.feat .fi{flex-shrink:0;width:42px;height:42px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--ac2)}
.feat .fi svg{width:22px;height:22px}
.feat h4{font-size:15px;margin-bottom:3px}
.feat p{color:var(--sub);font-size:13px;line-height:1.45}
.chip{display:flex;gap:8px;flex-wrap:wrap}
.chip span{background:var(--card2);border:1px solid var(--line);padding:6px 13px;border-radius:20px;font-size:13px;color:var(--sub)}
.toast{position:fixed;bottom:calc(var(--nav-h) + 18px);left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--ac);padding:13px 22px;border-radius:13px;z-index:100;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.5),var(--glow);font-weight:600;max-width:90vw;text-align:center}
.authtab{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.authtab div{flex:1;text-align:center;padding:11px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:600;color:var(--sub);transition:.15s}
.authtab div.on{background:var(--ac);color:#fff}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ulist{display:flex;flex-direction:column;gap:9px}
.uitem{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.uitem .ux{flex:1;min-width:0}
.uitem .un{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uitem .ud{font-size:12px;color:var(--sub)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700}
.tag.vip{background:rgba(245,158,11,.18);color:var(--warn)}
.tag.ban{background:rgba(239,68,68,.18);color:var(--err)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
@media(min-width:641px){
  body{padding-bottom:0}
  .botnav{display:none}
  .g2.wide{grid-template-columns:1fr 1fr}
}
>
</head>
<body x-data="app()" x-init="init()">

<!-- 顶部栏 -->
<div class="top"><div class="in">
  <div class="brand"><span class="dot"></span><b>aplm123</b></div>
  <div class="ptag" x-show="me" @click="tab='profile'">
    <morph-icon data-tab="profile" class="mi" viewBox="0 0 24 24" stroke-width="2" data-base="M12 7v10M9 10h4a2 2 0 010 4H9" icon="M12 7v10M9 10h4a2 2 0 010 4H9">
    <span x-text="me?.points||0"></span>
  </div>
</div></div>

<div class="wrap">

<!-- ===== 首页 ===== -->
<div class="view" x-show="tab=='home'">
  <div class="hero">
    <div class="badge">1752+ 平台 · 无水印 · 全功能</div>
    <h1>万能<span class="g">视频·图片</span><br>下载器</h1>
    <p>TikTok / YouTube / 抖音 / B站 / 小红书 全平台无水印下载</p>
    <button class="btn" @click="tab='dl'">
      <morph-icon data-tab="dl" class="mi" viewBox="0 0 24 24" stroke-width="2" data-base="M12 3v13m0 0l-4-4m4 4l4-4M5 21h14" icon="M12 3v13m0 0l-4-4m4 4l4-4M5 21h14">
      进入下载
    </button>
  </div>
  <div class="feat"><div class="fi"><morph-icon class="mi" viewBox="0 0 24 24" stroke-width="2" data-base="M4 6h16v12H4z M10 9l5 3-5 3z" icon="M4 6h16v12H4z M10 9l5 3-5 3z"></div><div><h4>全平台视频</h4><p>TikTok 自研无水印，YouTube/抖音/B站/快手 等 1752+ 站点</p></div></div>
  <div class="feat"><div class="fi"><morph-icon class="mi" viewBox="0 0 24 24" stroke-width="2" data-base="M21 15l-5-5L5 21" icon="M21 15l-5-5L5 21"></div><div><h4>图片图集</h4><p>小红书/Pinterest/Instagram 多图集一键打包，4816 站点</p></div></div>
  <div class="feat"><div class="fi"><morph-icon class="mi" viewBox="0 0 24 24" stroke-width="2" data-base="M9 11l3 3L22 4 M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" icon="M9 11l3 3L22 4 M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></div><div><h4>签到积分</h4><p>每日签到得积分，连续 7 天额外奖励，积分兑换下载券与 VIP</p></div></div>
  <div class="feat"><div class="fi"><morph-icon class="mi" viewBox="0 0 24 24" stroke-width="2" data-base="M12 2l2.4 7.4H22l-6 4.3 2.3 7.3-6.3-4.6L5.7 21 8 14 2 9.4h7.6z" icon="M12 2l2.4 7.4H22l-6 4.3 2.3 7.3-6.3-4.6L5.7 21 8 14 2 9.4h7.6z"></div><div><h4>抽奖 · VIP</h4><p>单抽/十连赢 VIP、日卡、积分；VIP 无限下载</p></div></div>
  <div class="card">
    <h3><morph-icon class="mi" viewBox="0 0 24 24" stroke-width="2" data-base="M2 12h20M12 2a15 15 0 010 20a15 15 0 010-20" icon="M2 12h20M12 2a15 15 0 010 20a15 15 0 010-20">支持平台</h3>
    <div class="chip"><template x-for="p in platforms"><span x-text="p"></span></template></div>
  </div>
</div>

<!-- ===== 下载 ===== -->
<div class="view" x-show="tab=='dl'">
  <!-- 未登录 -->
  <div x-show="!me">
    <div class="sec-t" style="text-align:center">账号中心</div>
    <div class="sec-d" style="text-align:center">注册即送 100 积分</div>
    <div class="card">
      <div class="authtab">
        <div :class="authMode=='login'&&'on'" @click="authMode='login'">登录</div>
        <div :class="authMode=='reg'&&'on'" @click="authMode='reg'">注册</div>
      </div>
      <label>用户名</label>
      <input x-model="auUser" placeholder="3-20 位" @keyup.enter="doAuth()">
      <label>密码</label>
      <input type="password" x-model="auPass" placeholder="至少 6 位" @keyup.enter="doAuth()">
      <button class="btn" style="margin-top:18px" @click="doAuth()" :disabled="loading">
        <span x-show="loading" class="spin"></span>
        <span x-text="loading?'处理中':(authMode=='reg'?'注册并登录':'登录')"></span>
      </button>
    </div>
  </div>
  <!-- 已登录：下载置顶 -->
  <div x-show="me">
    <div class="card">
      <h3><morph-icon class="mi" viewBox="0 0 24 24" stroke-width="2" data-base="M12 3v13m0 0l-4-4m4 4l4-4M5 21h14" icon="M12 3v13m0 0l-4-4m4 4l4-4M5 21h14">视频/图片下载</h3>
      <input x-model="dlUrl" placeholder="粘贴链接 · TikTok/抖音/B站/YouTube..." @keyup.enter="doDownload()">
      <button class="btn" style="margin-top:12px" @click="doDownload()" :disabled="loading">
        <span x-show="loading" class="spin"></span>
        <span x-text="loading?'下载中...':'开始下载（5 积分 · VIP免费）'"></span>
      </button>
      <div class="dlprev" x-show="dlResult">
        <p class="muted" style="margin-top:12px" x-text="dlResult?.title"></p>
        <template x-for="f in (dlResult?.files||[])"><div>
          <template x-if="dlResult.type=='video'"><video :src="f" controls playsinline></video></template>
          <template x-if="dlResult.type=='image'"><img :src="f"></template>
          <a class="btn sec sm" :href="f" download style="margin-top:9px;width:100%">⬇ 保存到相册/本地</a>
        </div></template>
      </div>
    </div>
    <div class="card">
      <h3><morph-icon class="mi" viewBox="0 0 24 24" stroke-width="2" data-base="M12 2l2.4 7.4H22l-6 4.3 2.3 7.3-6.3-4.6L5.7 21 8 14 2 9.4h7.6z" icon="M12 2l2.4 7.4H22l-6 4.3 2.3 7.3-6.3-4.6L5.7 21 8 14 2 9.4h7.6z">幸运抽奖</h3>
      <div class="g2">
        <button class="btn sm" @click="lottery('1')">单抽 · 50分</button>
        <button class="btn sm" @click="lottery('10')">十连 · 450分</button>
      </div>
      <p class="muted" style="margin-top:12px;min-height:20px" x-text="lotteryOut"></p>
    </div>
    <div class="card">
      <h3><morph-icon class="mi" viewBox="0 0 24 24" stroke-width="2" data-base="M12 7v5l3 2" icon="M12 7v5l3 2">下载历史</h3>
      <div class="ulist">
        <template x-for="h in history"><div class="muted" style="border-bottom:1px solid var(--line);padding:7px 0" x-text="h.time+' · '+(h.title||h.url).slice(0,34)"></div></template>
        <p class="muted" x-show="!history.length">暂无记录，下载后自动出现</p>
      </div>
    </div>
  </div>
</div>

<!-- ===== 数据 ===== -->
<div class="view" x-show="tab=='board'">
  <div class="sec-t">数据看板</div>
  <div class="sec-d" x-text="board?.notice?('📢 '+board.notice):'平台实时统计'"></div>
  <div class="g2" style="margin-bottom:14px">
    <div class="stat"><div class="n" x-text="board?.stats?.total_users||0"></div><div class="l">总用户</div></div>
    <div class="stat"><div class="n" x-text="board?.stats?.today_active||0"></div><div class="l">今日活跃</div></div>
    <div class="stat"><div class="n" x-text="board?.stats?.total_downloads||0"></div><div class="l">累计下载</div></div>
    <div class="stat"><div class="n" x-text="board?.stats?.vip_count||0"></div><div class="l">VIP 会员</div></div>
  </div>
  <div class="card"><h3>🏆 积分榜</h3><canvas id="c1" height="200"></canvas></div>
  <div class="card"><h3>📥 下载榜</h3><canvas id="c2" height="200"></canvas></div>
  <div class="card"><h3><morph-icon class="mi sm" stroke-width="2" data-base="M12 2s4 4 4 8a4 4 0 1 1-8 0" icon="M12 2s4 4 4 8a4 4 0 1 1-8 0"></morph-icon> 签到榜</h3>
    <div class="ulist">
      <template x-for="(r,i) in (board?.top_sign||[])"><div class="uitem">
        <b style="color:var(--ac2);width:20px" x-text="i+1"></b>
        <div class="ux"><div class="un" x-text="r.name"></div><div class="ud" x-text="'连签 '+r.sign+' 天'"></div></div>
        <span class="muted" x-text="r.points+' 分'"></span>
      </div></template>
    </div>
  </div>
</div>

<!-- ===== 我的（个人+设置+管理入口） ===== -->
<div class="view" x-show="tab=='profile'">
  <template x-if="!me">
    <div class="card" style="text-align:center;padding:40px 18px">
      <p class="muted" style="margin-bottom:16px">登录后查看个人中心</p>
      <button class="btn" @click="tab='dl'">去登录 / 注册</button>
    </div>
  </template>
  <template x-if="me">
  <div>
    <!-- 个人卡 -->
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-weight:800;font-size:19px" x-text="me?.first_name||me?.username||'用户'"></div>
          <div class="muted" x-text="'ID '+me?.uid"></div>
        </div>
        <button class="pill" @click="logout()">退出</button>
      </div>
      <div class="g2" style="margin-top:16px">
        <div class="stat"><div class="n" x-text="me?.points"></div><div class="l">积分 · 榜#<span x-text="me?.rank_points||'-'"></span></div></div>
        <div class="stat"><div class="n" x-text="me?.downloads_total"></div><div class="l">下载 · 榜#<span x-text="me?.rank_downloads||'-'"></span></div></div>
        <div class="stat"><div class="n" x-text="me?.sign_streak"></div><div class="l">连签 · 榜#<span x-text="me?.rank_sign||'-'"></span></div></div>
        <div class="stat"><div class="n" x-text="me?.vip?'VIP':'普通'"></div><div class="l" x-text="me?.vip?('至 '+me?.vip_until):'非会员'"></div></div>
      </div>
    </div>
    <!-- 签到 / 商城 -->
    <div class="card">
      <h3><morph-icon class="mi" viewBox="0 0 24 24" stroke-width="2" data-base="M9 11l3 3L22 4 M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" icon="M9 11l3 3L22 4 M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11">每日签到 & 商城</h3>
      <button class="btn" @click="sign()"><morph-icon class="mi sm" stroke-width="2" data-base="M3 21l3-1 11-11-2-2L4 18l-1 3z M14 6l4 4" icon="M3 21l3-1 11-11-2-2L4 18l-1 3z M14 6l4 4"></morph-icon> 每日签到 +10 积分</button>
      <div class="g2" style="margin-top:11px">
        <button class="btn sec sm" @click="buy('ticket')"><morph-icon class="mi sm" stroke-width="2" data-base="M22 10V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4a2 2 0 0 1 0 4v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a2 2 0 0 1 0-4zM9 12V8h2v4H9z M9 16v-2h2v2H9z" icon="M22 10V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4a2 2 0 0 1 0 4v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a2 2 0 0 1 0-4zM9 12V8h2v4H9z M9 16v-2h2v2H9z"></morph-icon> 下载券×10 · 80</button>

      <div class="stat"><div class="n" x-text="ov?.stats?.total_downloads||0"></div><div class="l">下载</div></div>

</div>

<div class="toast" x-show="toast" x-text="toast" x-transition></div>

<script>
function app(){return{
  tab:'home', loading:false, toast:'',
  platforms:['TikTok','YouTube','抖音','快手','B站','小红书','微博','西瓜','皮皮虾','Twitter/X','Instagram','Facebook','Reddit','Pinterest','淘宝','京东'],
  authMode:'login', auUser:'', auPass:'',
  bindStep:0, bindTgId:'', bindCode:'',
  me:null, token:localStorage.getItem('tok')||'',
  dlUrl:'', dlResult:null, lotteryOut:'', history:[],
  board:null,
  ov:null, users:{users:[],total:0}, userQ:'', a:{uid:'',amount:'',text:''}, ckRaw:'',

  init(){ if(this.token)this.loadMe(); this.loadBoard(); },
  tos(m){ this.toast=m; setTimeout(()=>this.toast='',2500); },
  async post(u,data){ const fd=new FormData(); for(let k in data)fd.append(k,data[k]);
    const h={}; if(this.token)h['X-Session']=this.token;
    const r=await fetch(u,{method:'POST',body:fd,headers:h}); return r.json(); },
  async get(u){ const h={}; if(this.token)h['X-Session']=this.token;
    const r=await fetch(u,{headers:h}); return r.json(); },

  async doAuth(){ if(!this.auUser||!this.auPass){this.tos('请填写用户名和密码');return} this.loading=true;
    const r=await this.post(this.authMode=='reg'?'/api/register':'/api/login',{username:this.auUser,password:this.auPass}); this.loading=false;
    if(r.ok){ this.token=r.token; localStorage.setItem('tok',r.token); await this.loadMe(); this.loadHistory(); this.tos(r.msg||'成功'); this.auPass=''; }
    else this.tos(r.msg); },
  async loadMe(){ try{ this.me=await this.get('/api/me'); }catch(e){ this.token='';localStorage.removeItem('tok'); } },
  logout(){ this.token='';this.me=null;localStorage.removeItem('tok'); this.tab='dl'; },

  async sign(){ const r=await this.post('/api/sign',{}); this.tos(r.msg); if(r.ok)this.loadMe(); },
  async doDownload(){ if(!this.dlUrl){this.tos('请输入链接');return} this.loading=true;this.dlResult=null;
    const r=await this.post('/api/download',{url:this.dlUrl}); this.loading=false;
    if(r.ok){ this.dlResult=r; this.loadMe(); this.loadHistory(); this.tos('下载成功'); } else this.tos(r.msg); },
  async buy(item){ const r=await this.post('/api/shop/buy',{item}); this.tos(r.msg); if(r.ok)this.loadMe(); },
  async lottery(mode){ const r=await this.post('/api/lottery',{mode});
    if(r.ok){ this.lotteryOut='🎉 '+r.results.join('  ')+'  · 剩 '+r.points+' 分'; this.loadMe(); } else this.tos(r.msg); },
  async loadHistory(){ if(!this.token)return; const r=await this.get('/api/history'); this.history=r.history||[]; },

  async loadBoard(){ this.board=await this.get('/api/stats'); this.$nextTick(()=>this.charts()); },
  charts(){ if(!this.board)return; ['c1','c2'].forEach((id,i)=>{ const el=document.getElementById(id); if(!el)return; if(el._c)el._c.destroy();
    const src=i==0?this.board.top_points:this.board.top_downloads, key=i==0?'points':'downloads';
    el._c=new Chart(el,{type:'bar',data:{labels:src.map(r=>r.name.slice(0,7)),datasets:[{data:src.map(r=>r[key]),backgroundColor:i==0?'#4f8cff':'#22d3ee',borderRadius:6}]},
      options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8595b3',font:{size:10}},grid:{display:false}},y:{ticks:{color:'#8595b3'},grid:{color:'#232f48'}}}}}); }); },

  async bindReq(){ if(!this.bindTgId){this.tos('请输入 TG ID');return} this.loading=true;
    const r=await this.post('/api/bind/tg/request',{tg_uid:this.bindTgId}); this.loading=false; this.tos(r.msg); if(r.ok)this.bindStep=2; },
  async bindVerify(){ this.loading=true; const r=await this.post('/api/bind/tg/verify',{code:this.bindCode}); this.loading=false;
    this.tos(r.msg); if(r.ok){ this.bindStep=0;this.bindCode='';this.bindTgId=''; this.loadMe(); } },
  async unbindTg(){ const r=await this.post('/api/bind/tg/unbind',{}); this.tos(r.msg); if(r.ok)this.loadMe(); },

  async loadOv(){ try{ this.ov=await this.get('/api/admin/overview'); }catch(e){} },
  async loadUsers(){ this.users=await this.get('/api/admin/users?q='+encodeURIComponent(this.userQ)); },
  async act(a){ const r=await this.post('/api/admin/action',{act:a,uid:this.a.uid,amount:this.a.amount,text:this.a.text}); this.tos(r.msg); if(r.ok){this.loadOv();this.loadUsers();} },
  async delUser(){ if(!this.a.uid){this.tos('请先选择用户');return} if(!confirm('确认删除用户 '+this.a.uid+' ？此操作不可恢复')){return}
    const r=await this.post('/api/admin/action',{act:'delete',uid:this.a.uid}); this.tos(r.msg); if(r.ok){this.a.uid='';this.loadOv();this.loadUsers();} },
  async ckSet(){ if(!this.ckRaw){this.tos('请粘贴Cookie');return} const r=await this.post('/api/admin/cookie',{act:'set',raw:this.ckRaw}); this.tos(r.msg); if(r.ok){this.ckRaw='';this.loadOv();} },
  async ckClear(){ const r=await this.post('/api/admin/cookie',{act:'clear'}); this.tos(r.msg); this.loadOv(); },
}}
</script>

<script type="module">
// === Morphicons 注册 + 底部导航交互 ===
import { defineMorphIcon } from '/assets/morph-element.js';
defineMorphIcon();

const wireNav = () => {
  document.querySelectorAll('.botnav a').forEach(a => {
    if (a.__mw) return; a.__mw = true;
    a.addEventListener('click', () => {
      const mi = a.querySelector('morph-icon');
      if (!mi) return;
      const base = mi.getAttribute('data-base');
      if (!base) return;
      mi.setAttribute('icon', 'M5 13l4 4L19 7');
      setTimeout(() => mi.setAttribute('icon', base), 700);
    });
  });
};
wireNav();
new MutationObserver(wireNav).observe(document.body, { childList: true, subtree: true });

window.morphTo = (sel, d) => {
  const el = document.querySelector(sel);
  if (el && el.setAttribute) el.setAttribute('icon', d);
};
</script>
